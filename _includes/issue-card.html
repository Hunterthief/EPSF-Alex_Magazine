{% assign fileName = include.file.name %}
{% assign pdfPath = include.file.path | relative_url %}
{% assign featured = include.featured | default: false %}

<a
  class="issue-card {% if featured %}featured{% endif %}"
  href="{{ '/viewer/' | relative_url }}?issue={{ include.file.path | url_encode }}"
  data-file-name="{{ fileName }}"
  data-pdf-url="{{ pdfPath }}"
>
  <div class="issue-cover">
    <div class="issue-cover-fallback">
      <span class="fallback-brand">EPSF Alex PE</span>
      <span class="fallback-title js-cover-title">{{ fileName }}</span>
    </div>
  </div>

  <div class="issue-info">
    <h3 class="issue-title js-issue-title">{{ fileName }}</h3>
    <p class="issue-date js-issue-date"></p>
    {% if featured %}
      <span class="read-btn">Read Issue →</span>
    {% endif %}
  </div>
</a>
